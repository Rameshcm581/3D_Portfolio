<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f9');
      })();
    </script>
    <title>Ramesh C | Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Ramesh C, a software engineer focused on Python, FastAPI, backend systems, workflow automation, and applied AI."
    />
    <meta name="author" content="Ramesh C" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ramesh C | Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Ramesh C, a software engineer focused on Python, FastAPI, backend systems, workflow automation, and applied AI."
    />
    <meta property="og:site_name" content="Ramesh C Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramesh C | Software Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ramesh C, a software engineer focused on Python, FastAPI, backend systems, workflow automation, and applied AI."
    />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Personal Brand Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/images/ramesh-logo-cropped.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
